[package]
name = "lattice-engine"
version = "0.1.0"
edition = "2024"
description = "Deterministic pairwise and t-way covering-array generation with constraints."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["cli"]
cli = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "lattice-engine"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
