name: Publish to crates.io

# A v* tag runs the tests and lints, then publishes the crate once the
# `crates-io` environment is approved. The token lives in the repository secret
# CARGO_REGISTRY_TOKEN (scopes: publish-new, publish-update).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/lattice-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
